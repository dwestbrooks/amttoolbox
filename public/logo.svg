<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" fill="none" role="img" aria-label="AMT Toolbox">
  <!-- Wrench icon -->
  <g transform="translate(2, 6)">
    <!-- Wrench body -->
    <path d="M18 4C12.48 4 8 8.48 8 14c0 2.1.67 4.05 1.8 5.63L2.22 27.21A2.5 2.5 0 0 0 2 28.5C2 29.88 3.12 31 4.5 31s2.5-1.12 2.5-2.5c0-.49-.14-.95-.38-1.34L14.2 19.5c1.41.96 3.12 1.5 4.96 1.5 5.52 0 10-4.48 10-10V10l-4 4-3-1-1-3 4-4h-1z" fill="#38bdf8"/>
    <!-- Gear overlay (small, top right of wrench area) -->
    <circle cx="26" cy="6" r="5" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
    <circle cx="26" cy="6" r="2" fill="#7dd3fc"/>
    <line x1="26" y1="1" x2="26" y2="3" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="26" y1="9" x2="26" y2="11" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="21" y1="6" x2="23" y2="6" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="29" y1="6" x2="31" y2="6" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- AMT Toolbox text -->
  <!-- "AMT" in bold sky-blue -->
  <text x="38" y="29" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="20" letter-spacing="-0.5" fill="#38bdf8">AMT</text>
  <!-- "Toolbox" in white, slightly smaller -->
  <text x="87" y="29" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="20" letter-spacing="-0.5" fill="#f1f5f9">Toolbox</text>

  <!-- Subtle underline accent between AMT and Toolbox -->
  <rect x="38" y="33" width="152" height="2" rx="1" fill="#1e3a5f" opacity="0.6"/>
</svg>
