<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines subtle -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#334155" stroke-width="1" opacity="0.4"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#334155" stroke-width="1" opacity="0.4"/>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Icon area — wrench silhouette (simplified) -->
  <g transform="translate(100, 240)">
    <rect x="0" y="20" width="80" height="20" rx="10" fill="#38bdf8" opacity="0.9" transform="rotate(-45 40 30)"/>
    <circle cx="20" cy="10" r="18" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.9"/>
    <circle cx="20" cy="10" r="8" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- Main title -->
  <text x="200" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-2">AMT Toolbox</text>

  <!-- Subtitle -->
  <text x="200" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="#94a3b8">Free Calculators &amp; Reference Tools</text>
  <text x="200" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="#94a3b8">for A&amp;P Mechanics &amp; Students</text>

  <!-- Feature pills -->
  <g transform="translate(200, 420)">
    <rect x="0" y="0" width="200" height="44" rx="22" fill="#1e40af" opacity="0.7"/>
    <text x="100" y="28" font-family="system-ui, sans-serif" font-size="20" fill="#93c5fd" text-anchor="middle" font-weight="600">14 Tools</text>

    <rect x="220" y="0" width="220" height="44" rx="22" fill="#164e63" opacity="0.7"/>
    <text x="330" y="28" font-family="system-ui, sans-serif" font-size="20" fill="#67e8f9" text-anchor="middle" font-weight="600">Practice Exams</text>

    <rect x="460" y="0" width="180" height="44" rx="22" fill="#1e3a5f" opacity="0.7"/>
    <text x="550" y="28" font-family="system-ui, sans-serif" font-size="20" fill="#7dd3fc" text-anchor="middle" font-weight="600">100% Free</text>
  </g>

  <!-- URL -->
  <text x="200" y="560" font-family="system-ui, sans-serif" font-size="24" fill="#475569">amttoolbox.com</text>

  <!-- Accent bar bottom -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)"/>
</svg>